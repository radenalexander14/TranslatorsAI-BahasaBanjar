services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indo-banjar-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount your trained model (so you can update it without rebuilding the image)
      - ./backend/models:/app/models
    command: ["python", "server.py", "--model", "/app/models/translator_mt5", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indo-banjar-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
